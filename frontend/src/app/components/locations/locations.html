<h2>Locations</h2>

<!-- Admin Actions -->
<div *ngIf="isAdmin" class="admin-header">
  <a routerLink="/locations/new" class="btn btn-primary">Create New Location</a>
</div>

<!-- Search and Filter Section -->
<div class="filters-section">
  <div class="filter-group">
    <label>Search by Name:</label>
    <input type="text" [(ngModel)]="searchName" (ngModelChange)="applyFilters()" 
           placeholder="Enter location name..." class="filter-input">
  </div>

  <div class="filter-group">
    <label>Search by Address:</label>
    <input type="text" [(ngModel)]="searchAddress" (ngModelChange)="applyFilters()" 
           placeholder="Enter address..." class="filter-input">
  </div>

  <div class="filter-group">
    <label>Filter by Type:</label>
    <select [(ngModel)]="filterType" (ngModelChange)="applyFilters()" class="filter-select">
      <option value="">All Types</option>
      <option *ngFor="let type of getUniqueTypes()" [value]="type">{{ type }}</option>
    </select>
  </div>
</div>

<!-- Results Count -->
<div class="results-info">
  Showing {{ filteredLocations.length }} of {{ locations.length }} locations
</div>

<div class="locations-grid">
  <div *ngFor="let item of filteredLocations" class="location-card">
    <!-- Location Image -->
    <div class="location-image-container">
      <img *ngIf="item.images && item.images.length > 0" 
           [src]="getImageUrl(item.images[0].path)" 
           [alt]="item.location.name"
           class="location-thumbnail">
      <div *ngIf="!item.images || item.images.length === 0" class="no-image">
        No Image
      </div>
    </div>

    <!-- Location Info -->
    <div class="location-info">
      <h3>
        <a [routerLink]="['/locations', item.location.name]">{{ item.location.name }}</a>
      </h3>
      <div class="rating">
        <span class="rating-label">Rating:</span>
        <span class="rating-value">{{ item.averageRating.toFixed(1) }}/10</span>
      </div>
      <p class="address">{{ item.location.address }}</p>
      <p class="type">{{ item.location.type }}</p>
    </div>

    <!-- Admin Actions -->
    <div *ngIf="isAdmin" class="admin-actions">
      <a [routerLink]="['/locations/edit', item.location.name]" class="btn btn-sm btn-edit">Edit</a>
      <button (click)="deleteLocation(item.location.name)" class="btn btn-sm btn-delete">Delete</button>
    </div>
  </div>
</div>
