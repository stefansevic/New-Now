<h2>Register</h2>
<div *ngIf="successMessage" class="success-message">
  {{ successMessage }}
</div>
<form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="register-form">
  <div class="form-group">
    <label for="name">Full Name *</label>
    <input type="text" id="name" formControlName="name" placeholder="Enter your full name">
    <small class="form-hint">Your first and last name</small>
  </div>

  <div class="form-group">
    <label for="email">Email *</label>
    <input type="email" id="email" formControlName="email" placeholder="Enter your email">
  </div>

  <div class="form-group">
    <label for="password">Password *</label>
    <input type="password" id="password" formControlName="password" placeholder="At least 6 characters">
    <small class="form-hint">Minimum 6 characters</small>
  </div>

  <div class="form-group">
    <label for="phoneNumber">Phone Number *</label>
    <input type="tel" id="phoneNumber" formControlName="phoneNumber" placeholder="Enter your phone number">
  </div>

  <div class="form-group">
    <label for="birthday">Birthday *</label>
    <input type="date" id="birthday" formControlName="birthday">
  </div>

  <div class="form-group">
    <label for="address">Address *</label>
    <input type="text" id="address" formControlName="address" placeholder="Enter your address">
  </div>

  <div class="form-group">
    <label for="city">City *</label>
    <input type="text" id="city" formControlName="city" placeholder="Enter your city">
  </div>

  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>

  <button type="submit" [disabled]="!registerForm.valid" class="btn-submit">Register</button>
</form>
